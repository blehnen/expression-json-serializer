name: SonarQube

on:
  push:
    branches: [ master ]
  pull_request:
    types: [ opened, synchronize, reopened ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    # SONAR_TOKEN is not exposed to fork PRs or Dependabot PRs, so the scanner
    # would fail on auth rather than skip. Only analyze when the token exists.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0          # shallow clones hurt analysis relevancy (blame / new code)
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

      - name: Build, test and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          # Rule exclusions below are architectural, not deferred work. Each one is a
          # decision that the rule is wrong for this codebase; see docs/sonar-exclusions.md
          # for the full reasoning. Anything genuinely fixable was fixed instead.
          #
          #   e1  S1172  "unused parameter" -- all 25 deserializer handlers share the
          #              uniform (nodeType, type, obj) signature driven by one switch
          #              table. Some use `type`, some don't. Dropping the unused params
          #              would make the dispatch heterogeneous, which is strictly worse.
          #   e2  S3011  "accessibility bypass" -- reflecting over non-public members is
          #              precisely what deserializing an expression tree requires.
          #   e3  S2325  "make static" \_ the Serializer/Deserializer handler families are
          #   e4  CA1822 "make static" /  deliberately uniform instance methods.
          #   e5  CA1861 "hoist constant array" -- the array literal is inside the
          #              expression tree under test; hoisting it defeats the test.
          #   e6  CA1859 "narrow return type" -- Method3 returns object on purpose so the
          #              MethodResultCast test can exercise an unbox/convert node.
          ${{ runner.temp }}\scanner\dotnet-sonarscanner begin `
            /k:"blehnen_expression-json-serializer" `
            /o:"blehnen" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" `
            /d:sonar.issue.ignore.multicriteria="e1,e2,e3,e4,e5,e6" `
            /d:sonar.issue.ignore.multicriteria.e1.ruleKey="csharpsquid:S1172" `
            /d:sonar.issue.ignore.multicriteria.e1.resourceKey="**/Deserializer.*.cs" `
            /d:sonar.issue.ignore.multicriteria.e2.ruleKey="csharpsquid:S3011" `
            /d:sonar.issue.ignore.multicriteria.e2.resourceKey="**/Deserializer.Reflection.cs" `
            /d:sonar.issue.ignore.multicriteria.e3.ruleKey="csharpsquid:S2325" `
            /d:sonar.issue.ignore.multicriteria.e3.resourceKey="**/Aq.ExpressionJsonSerializer/**" `
            /d:sonar.issue.ignore.multicriteria.e4.ruleKey="external_roslyn:CA1822" `
            /d:sonar.issue.ignore.multicriteria.e4.resourceKey="**/Aq.ExpressionJsonSerializer/**" `
            /d:sonar.issue.ignore.multicriteria.e5.ruleKey="external_roslyn:CA1861" `
            /d:sonar.issue.ignore.multicriteria.e5.resourceKey="**/ExpressionJsonSerializerTest.cs" `
            /d:sonar.issue.ignore.multicriteria.e6.ruleKey="external_roslyn:CA1859" `
            /d:sonar.issue.ignore.multicriteria.e6.resourceKey="**/ExpressionJsonSerializerTest.cs"
          dotnet build "Aq.ExpressionJsonSerializer.sln" -c Debug
          dotnet test "Aq.ExpressionJsonSerializer.Tests/Aq.ExpressionJsonSerializer.Tests.csproj" `
            -f net10.0 -c Debug --no-build `
            --collect:"XPlat Code Coverage;Format=opencover" `
            --results-directory "${{ github.workspace }}/TestResults"
          ${{ runner.temp }}\scanner\dotnet-sonarscanner end
